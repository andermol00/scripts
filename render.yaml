services:
  - type: web
    name: tampervault
    runtime: node
    plan: free
    # init-db es un primer respaldo; /api/health también verifica/crea el
    # esquema en runtime, por si DATABASE_URL no está visible durante el build.
    buildCommand: yarn install && node scripts/init-db.mjs && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tampervault-db
          property: connectionString

databases:
  - name: tampervault-db
    plan: free
    postgresMajorVersion: 16
