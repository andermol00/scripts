services:
  - type: web
    name: script-vault
    runtime: node
    plan: free
    buildCommand: npm ci && npx drizzle-kit push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: script-vault-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: REGISTRATION_SECRET
        generateValue: true

databases:
  - name: script-vault-db
    plan: basic-256mb
    databaseName: script_vault
    user: script_vault
