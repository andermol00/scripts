services:
  - type: web
    name: tampervault
    runtime: node
    plan: free
    # El init-db.mjs crea las tablas automáticamente (idempotente) antes de compilar.
    buildCommand: npm install && node scripts/init-db.mjs && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tampervault-db
          property: connectionString

databases:
  - name: tampervault-db
    plan: free
    postgresMajorVersion: 16
